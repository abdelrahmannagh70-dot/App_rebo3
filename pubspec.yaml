
  name: app3
  description: "A new Flutter project."

  publish_to: 'none'

  version: 1.0.0+1

  environment:
    sdk: ^3.7.2

  dependencies:
    flutter:
      sdk: flutter

    cupertino_icons: ^1.0.8
    flutter_screenutil: ^5.9.3
    easy_localization: ^3.0.8
    flutter_bloc: ^9.1.1
    flutter_native_splash: ^2.4.6
    dio: ^5.11.1
    shared_preferences: ^2.5.3
    skeletonizer: ^1.4.3

  dev_dependencies:
    flutter_test:
      sdk: flutter

    flutter_lints: ^5.0.0

  flutter:
    uses-material-design: true

    assets:
      - assets/translations/
      - assets/images/
      

    fonts:
      - family: DM
        fonts:
          - asset: assets/fonts/DMSerifDisplay-Italic.ttf
          - asset: assets/fonts/DMSerifDisplay-Regular.ttf

